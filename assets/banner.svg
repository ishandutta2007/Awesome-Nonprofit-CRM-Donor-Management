<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .stat-num {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #f8fafc;
      }
      .stat-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
      }

      /* Dynamic pulse and floating effects */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-node-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .glowing-orb {
        transform-origin: center;
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1050" y1="0" x2="1050" y2="340" />
  </g>

  <!-- Glowing background orbs (strictly in background) -->
  <circle class="glowing-orb" cx="150" cy="90" r="130" fill="#38bdf8" filter="url(#glow)" />
  <circle class="glowing-orb" cx="1060" cy="180" r="160" fill="#ec4899" filter="url(#glow)" />
  <circle class="glowing-orb" cx="800" cy="60" r="110" fill="#6366f1" filter="url(#glow)" />

  <!-- Background Animated Data Stream Connection -->
  <path class="stream-line" d="M 620,170 Q 750,90 900,160 T 1140,170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
  <path class="stream-line" d="M 640,240 Q 780,280 940,220 T 1150,260" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.25" />

  <!-- Right Decorative Interactive Cards (positioned to never collide with titles) -->
  <g class="floating-node-1" transform="translate(860, 50)">
    <rect width="270" height="90" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="40" cy="45" r="20" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
    <text x="40" y="50" font-size="18" text-anchor="middle" fill="#38bdf8">🤝</text>
    <text class="stat-num" x="75" y="42">Constituent Hub</text>
    <text class="stat-label" x="75" y="62">360° Donor Stewardship &amp; Gifts</text>
  </g>

  <g class="floating-node-2" transform="translate(890, 160)">
    <rect width="250" height="85" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="42" r="18" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1.5" />
    <text x="36" y="47" font-size="16" text-anchor="middle" fill="#ec4899">⚡</text>
    <text class="stat-num" x="68" y="38">Open &amp; Cloud Stacks</text>
    <text class="stat-label" x="68" y="58">Self-Hosted + SaaS Solutions</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Titles, Feature Pills -->
  <!-- Top Category Pill -->
  <g transform="translate(70, 48)">
    <rect width="240" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text class="badge-text" x="30" y="20">NONPROFIT TECH ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text class="title" x="70" y="125">Awesome Nonprofit CRM</text>
  <text class="title" x="70" y="172" fill="url(#accent-grad)">&amp; Donor Management</text>

  <!-- Subtitle -->
  <text class="subtitle" x="70" y="215">Curated directory of SaaS solutions, self-hosted open-source software,</text>
  <text class="subtitle" x="70" y="240">fundraising automation, and modern constituent relationship platforms.</text>

  <!-- Feature Pills in Bottom Left -->
  <g transform="translate(70, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="pill-text" x="65" y="20" text-anchor="middle">🎁 Donor Tracking</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(142, 0)">
      <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="pill-text" x="72" y="20" text-anchor="middle">🚀 Campaign Automation</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(299, 0)">
      <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="pill-text" x="70" y="20" text-anchor="middle">🛡️ Data Sovereignty</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(451, 0)">
      <rect width="115" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="pill-text" x="57" y="20" text-anchor="middle">⭐ 100% Free/OSS</text>
    </g>
  </g>

  <!-- Bottom Accent Border Gradient -->
  <rect x="0" y="334" width="1200" height="6" rx="3" fill="url(#accent-grad)" />
</svg>
